name: Generate Contribution Snake

on:
  schedule:
    # daily at 00:20 UTC
    - cron: "20 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: JEEVAN2710
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6ec7
            dist/github-snake-light.svg?palette=github-light&color_snake=#39ff9d
            dist/github-snake.gif?color_snake=#39ff9d&color_dots=#0d1117,#123322,#1c4a30,#2fae7a,#39ff9d

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
