name: Generate Contribution Snake

on:
  schedule:
    - cron: "20 0 * * *"   # daily 00:20 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JEEVAN2710
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39ff9d
            dist/github-snake-light.svg?palette=github-light&color_snake=#0fae6e

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
